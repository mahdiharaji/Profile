<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahdi Haraji | Profile</title>
    <!-- FontAwesome 6 for updated brand icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts for high-quality Nastaliq rendering cross-platform -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
    <style>
        /* Light Mode (Default) Variables */
        :root {
            --bg-color: #e0e5ec;
            --text-color: #333333;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
        }

        /* Auto Dark Mode Variables */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #292d32;
                --text-color: #eeeeee;
                --shadow-light: #3d434a;
                --shadow-dark: #15171a;
            }
        }

        /* Default Layout for Mobile (Aligned to top) */
        body {
            margin: 0;
            padding: 40px 20px 20px 20px; /* Gives a clean top margin on mobile */
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Pulls the card upward on mobile */
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Neumorphic Container Card */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 30px;
            background-color: var(--bg-color);
            box-shadow: 10px 10px 20px var(--shadow-dark), 
                       -10px -10px 20px var(--shadow-light);
            box-sizing: border-box;
            transition: padding 0.3s ease;
        }

        /* Alignment Row for Avatar + Text */
        .profile-header {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 22px;
            margin-bottom: 20px;
            padding: 5px;
            box-sizing: border-box;
        }

        /* Left-aligned Avatar Styling */
        .avatar {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                       -6px -6px 12px var(--shadow-light);
            flex-shrink: 0;
        }

        /* Header Text Styling */
        .profile-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin: 0 0 4px 0;
        }

        .profile-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            opacity: 0.75;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Persian Nastaliq Status Styling */
        .status-text {
            font-family: 'Noto Nastaliq Urdu', 'IranNastaliq', 'Segoe UI Nastaliq', cursive;
            text-align: center;
            direction: rtl;
            font-size: 1.25rem;
            line-height: 2.4rem;
            color: var(--text-color);
            margin-bottom: 25px;
            width: 100%;
            box-sizing: border-box;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 18px; /* Mobile button spacing */
            transition: gap 0.3s ease;
        }

        /* Neumorphic Button Styling */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1rem;
            border-radius: 15px;
            background-color: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), 
                       -5px -5px 10px var(--shadow-light);
            transition: all 0.2s ease-in-out;
        }

        /* Interactive "Pressed" State */
        .link-btn:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
        }

        .link-btn i {
            font-size: 1.25rem;
            width: 24px;
            text-align: center;
        }
        
        /* Subtle Icon Colors */
        .fa-whatsapp { color: #25D366; }
        .fa-telegram { color: #0088cc; }
        .fa-reddit { color: #FF4500; }
        .fa-envelope { color: #D44638; }
        
        @media (prefers-color-scheme: light) {
            .fa-x-twitter, .fa-steam { color: #000000; }
        }
        @media (prefers-color-scheme: dark) {
            .fa-x-twitter, .fa-steam { color: #ffffff; }
        }

        /* Desktop Mode Layout Overrides */
        @media (min-width: 768px) {
            body {
                justify-content: center; /* Centers everything vertically again on Desktop */
                padding: 20px;
            }
            .links-wrapper {
                gap: 26px; /* Larger spacing between buttons on desktop */
            }
            .profile-container {
                padding: 45px 30px; /* Expanded card padding on desktop */
            }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Profile Header Section -->
        <div class="profile-header">
            <img src="https://avatars.githubusercontent.com/u/39735743" alt="Mahdi Haraji" class="avatar">
            <div class="profile-info">
                <h1 class="profile-name">Mahdi Haraji</h1>
                <p class="profile-title">⋈ monarch ⋈</p>
            </div>
        </div>

        <!-- Persian Status Text -->
        <div class="status-text">مرا داد فرمود و خود داور است</div>
        
        <!-- Link Buttons -->
        <div class="links-wrapper">
            <a href="https://wa.me/+989179703892" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
            
            <a href="https://t.me/buggydude" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-telegram"></i> Telegram
            </a>
            
            <a href="https://x.com/xXM0NARCHXx" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-x-twitter"></i> Twitter / X
            </a>
            
            <a href="https://www.reddit.com/u/Jueyuan/" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-reddit"></i> Reddit
            </a>
            
            <a href="mailto:mahdiharaji@gmail.com" class="link-btn">
                <i class="fa-solid fa-envelope"></i> Email
            </a>
            
            <a href="https://steamcommunity.com/id/monarch4ever" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-steam"></i> Steam
            </a>
        </div>
    </div>

</body>
</html>
